<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chesapeake Bay Route Planner</title>
<meta name="description" content="Daily route planner for Chesapeake Bay Support LLC.">
<meta name="theme-color" content="#f2eee3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 42 42'%3E%3Ccircle cx='21' cy='21' r='21' fill='%23b9bf8e'/%3E%3Cpath d='M21 8c-6 5-8 10-6 15.5 1.5-4 4-7 8-9-3 4-4.5 8-4 13 6-3 8-10 2-19.5z' fill='%2323261a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
/* Layout: brand header, then jobs (left) and the route (right); one column on phones.
   Off-white cream, light olive buttons, dark ink. */
:root{
  --bg:#f2eee3; --surface:#faf8f3; --field:#ffffff; --soft:#efebe1; --line:#ddd7ca;
  --ink:#22201d; --muted:#6c675e; --accent:#b9bf8e; --accent-edge:#a5ac78; --on-accent:#23261a; --olive-ink:#868d5e;
  --deep:#22201d; --on-deep:#faf8f3; --sky:#e2e4cd; --on-sky:#22201d; --route:#7e8653;
  --display:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.wrap{max-width:1060px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent-edge);outline-offset:2px}

/* header */
header .wrap{padding-block:24px 0;display:flex;gap:12px;align-items:center}
.mark{flex:none;width:36px;height:36px}
.brand{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--olive-ink);font-weight:700}
h1{font-family:var(--display);font-weight:700;letter-spacing:-.015em;font-size:clamp(24px,5.5vw,30px);line-height:1.1;margin:1px 0 0}

/* panels */
main .wrap{padding-block:20px 32px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;align-items:start}
@media (max-width:820px){main .wrap{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 14px}
h2{font-family:var(--display);font-weight:700;letter-spacing:-.005em;font-size:21px;margin:0}
.progress{font-size:14px;font-weight:700;color:var(--olive-ink);font-variant-numeric:tabular-nums}
.lbl{display:block;font-weight:700;font-size:14px;margin:0 0 6px}
.field{margin-bottom:18px}
input[type=text],input[type=password]{width:100%;font-size:16px;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px}

/* address boxes + suggestions */
.addr-box{position:relative;min-width:0}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;list-style:none;margin:0;padding:4px;background:var(--field);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(34,32,29,.12)}
.sugg li{padding:8px 10px;border-radius:7px;cursor:pointer;line-height:1.3}
.sugg li b{display:block;font-weight:600;font-size:15px}
.sugg li span{font-size:13px;color:var(--muted)}
.sugg li[aria-selected="true"],.sugg li:hover{background:var(--soft)}
.jobs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.jobs > li{display:grid;grid-template-columns:24px minmax(0,1fr) 64px;gap:8px;align-items:center}
.jn{font-family:var(--display);font-weight:600;font-size:16px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.clr{appearance:none;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:700;padding:10px 4px;border-radius:8px;cursor:pointer;visibility:hidden}
.jobs > li.filled .clr,.jobs > li.extra .clr{visibility:visible}
.clr:hover{color:var(--ink);background:var(--soft)}
.note{grid-column:2 / -1;font-size:13px;line-height:1.4;color:var(--muted);margin:-2px 0 2px}
.note:empty{display:none}
#start-note{margin-top:6px}
.note.warn{color:var(--ink);font-weight:700}

/* buttons */
.btn{appearance:none;border:0;border-radius:10px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn-main{width:100%;min-height:46px;background:var(--accent);color:var(--on-accent);border:1px solid var(--accent-edge);font-size:15px;letter-spacing:.005em;padding:11px 16px;box-shadow:0 1px 0 rgba(35,38,26,.06)}
.btn-main:hover{background:var(--accent-edge)}
.btn-main:disabled{opacity:.6;cursor:wait}
.btn-main .ic{width:16px;height:16px}
.btn-soft{background:var(--soft);color:var(--ink);border:1px solid var(--line);padding:10px 14px;font-size:15px}
.btn-line{background:transparent;color:var(--muted);border:1px solid var(--line);padding:10px 14px;font-size:15px}
.btn-link{appearance:none;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:6px 0;cursor:pointer}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.row-btns .btn{flex:1 1 auto}
@media (prefers-reduced-motion: no-preference){.btn{transition:background-color .15s,filter .15s}}

.checks{display:grid;gap:10px;margin:0 0 6px}
.checks label{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.checks input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--olive-ink);flex:none}
.plan-bar{margin-top:14px}
.status{margin-top:10px;font-size:14px;color:var(--muted)}
.status:empty{display:none}
.status.err{color:var(--ink);font-weight:700}

/* route */
.stale{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;margin:0 0 12px}
.actions{display:grid;gap:8px;margin-bottom:12px}
.map{height:300px;border-radius:12px;border:1px solid var(--line);overflow:hidden;margin:0 0 6px;background:var(--soft)}
.credit{font-size:11px;color:var(--muted);margin:0 0 14px;text-align:right}
.credit a{color:inherit}
.m-pin{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);border:2px solid #fff;display:grid;place-items:center;font:700 12px var(--display);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.m-pin.done{background:#d9d6cc;color:#6c675e}
.m-hq{width:28px;height:28px;border-radius:8px;background:var(--deep);color:var(--on-deep);border:2px solid #fff;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.m-hq svg{width:15px;height:15px}
.glance{list-style:none;margin:0 0 16px;padding:6px 14px;border:1px solid var(--line);border-radius:12px}
.glance li{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:12px;align-items:center;min-height:38px}
.glance .rail{position:relative;align-self:stretch;display:grid;place-items:center}
.glance .rail::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--line)}
.glance li:first-child .rail::before{top:50%}
.glance li:last-child .rail::before{bottom:50%}
.glance .rail i{position:relative;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--surface)}
.glance .g-home .rail i{width:12px;height:12px;border-radius:3px;background:var(--deep)}
.glance b{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.glance small{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.glance li.done b{color:var(--muted);text-decoration:line-through}
.glance li.done .rail i{background:var(--line)}
.from{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px;margin:0 0 4px;overflow-wrap:anywhere}
.from b{color:var(--ink);font-weight:600}
.ic{width:18px;height:18px;flex:none}
.stops{list-style:none;margin:0 0 6px;padding:0}
.stops > li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.stops > li:first-child{border-top:0}
.num{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-family:var(--display);font-weight:700;font-size:16px;display:grid;place-items:center}
.home-ic{width:34px;height:34px;display:grid;place-items:center;color:var(--muted)}
.addr{font-weight:600;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.done-box{display:inline-flex;align-items:center;gap:8px;margin-top:6px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer}
.done-box input{width:22px;height:22px;margin:0;accent-color:var(--olive-ink)}
.stops > li.isdone{background:var(--soft);border-radius:10px;padding-inline:10px;margin-inline:-10px}
.stops > li.isdone .addr{text-decoration:line-through;color:var(--muted)}
.stops > li.isdone .done-box{color:var(--ink)}
.stops > li.isdone .navs{opacity:.4;pointer-events:none}
.navs{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.nav{background:var(--sky);color:var(--on-sky);padding:9px 18px;font-size:14px;border-radius:10px}
.missed{font-size:14px;font-weight:600;margin:8px 0 0}
@media (max-width:560px){
  .stops > li{grid-template-columns:34px minmax(0,1fr);align-items:start}
  .stops > li > .navs{grid-column:2;justify-content:flex-start}
  .stops > li > .navs .nav{flex:1}
}
.empty{color:var(--muted);text-align:center;padding:36px 10px}
.empty svg{display:block;margin:0 auto 10px;width:72px;height:72px}
.site-foot{padding-block:0 28px;text-align:center;font-size:13px;color:var(--muted)}
.site-foot button{margin-left:6px}

/* PIN screen */
.lock{min-height:70vh;display:grid;place-items:center;padding-block:32px}
.lock-card{width:min(360px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center}
.lock-card h2{margin-bottom:4px}
.lock-card p{color:var(--muted);font-size:14px;margin:0 0 16px}
.lock-card input{text-align:center;letter-spacing:.3em;font-size:20px;margin-bottom:10px}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <svg class="mark" viewBox="0 0 42 42" role="img" aria-label="Chesapeake Bay Support LLC logo">
      <circle cx="21" cy="21" r="21" fill="var(--accent)"/>
      <path d="M21 8c-6 5-8 10-6 15.5 1.5-4 4-7 8-9-3 4-4.5 8-4 13 6-3 8-10 2-19.5z" fill="var(--on-accent)"/>
      <path d="M7 30c4-3 7-3 10.5 0s7 3 10.5 0 6.5-3 8 0" fill="none" stroke="var(--on-accent)" stroke-width="2.2" stroke-linecap="round" opacity=".8"/>
    </svg>
    <div>
      <div class="brand">Chesapeake Bay Support LLC</div>
      <h1>Daily Route Planner</h1>
    </div>
  </div>
</header>

<!-- PIN screen -->
<section class="lock wrap" id="lock" hidden>
  <form class="lock-card" id="lock-form">
    <h2>Crew sign in</h2>
    <p>Enter the crew PIN to see today's route.</p>
    <input type="password" id="pin" inputmode="numeric" autocomplete="current-password" aria-label="Crew PIN" required>
    <button class="btn btn-main" type="submit" id="pin-go">Sign in</button>
    <div class="status" id="pin-status" role="status"></div>
  </form>
</section>

<main id="app" hidden>
  <div class="wrap">
    <section class="panel" aria-labelledby="in-h">
      <div class="panel-h"><h2 id="in-h">Today's jobs</h2></div>

      <div class="field">
        <label class="lbl" for="start">Start of the day</label>
        <div class="addr-box">
          <input type="text" id="start" autocomplete="off" placeholder="HQ address" role="combobox" aria-autocomplete="list" aria-expanded="false">
        </div>
        <div class="note" id="start-note" aria-live="polite"></div>
      </div>

      <div class="field">
        <span class="lbl" id="jobs-l">Job addresses</span>
        <ol class="jobs" id="jobs" aria-labelledby="jobs-l"></ol>
        <div class="row-btns">
          <button class="btn btn-soft" id="add" type="button">+ Add another job box</button>
          <button class="btn btn-line" id="clear" type="button">Clear all jobs</button>
        </div>
      </div>

      <div class="checks">
        <label><input type="checkbox" id="home" checked> End the day back at HQ</label>
        <label><input type="checkbox" id="tolls" checked> Avoid toll roads</label>
      </div>

      <div class="plan-bar">
        <button class="btn btn-main" id="go" type="button">Plan route</button>
        <div class="status" id="status" role="status"></div>
      </div>
    </section>

    <section class="panel" aria-labelledby="out-h">
      <div class="panel-h"><h2 id="out-h">Drive order</h2><span class="progress" id="progress"></span></div>
      <div id="out"></div>
    </section>
  </div>
</main>

<footer class="site-foot" id="foot"><div class="wrap">Chesapeake Bay Support LLC<button class="btn-link" id="signout" type="button" hidden>Sign out</button></div></footer>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" defer></script>
<script>
(() => {
"use strict";

/* ============ settings ============ */
const DEFAULT_START = "4311 Manchester Lane, Chesapeake, VA";
const BASE_BOXES = 10;
const MAP_STYLE = "https://tiles.openfreemap.org/styles/positron";
const SYNC_EVERY = 20000;   // check for crew updates every 20 seconds

/* ============ helpers ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const key = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const today = () => new Date().toLocaleDateString("en-CA");          // YYYY-MM-DD, local time
const HOUSE = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>';
const OUT = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 5h5v5"/><path d="M19 5l-8 8"/><path d="M18 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h4"/></svg>';

/* ============ talking to the server ============ */
class NeedPin extends Error {}
async function api(path, opts = {}){
  const r = await fetch("/api/" + path, {
    method: opts.method || "GET", credentials: "same-origin",
    headers: opts.body ? {"content-type":"application/json"} : {},
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (r.status === 401 && path !== "login") { showLock(); throw new NeedPin(); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || "Something went wrong. Try again.");
  return data;
}

/* ============ sign in ============ */
function showLock(){ $("app").hidden = true; $("signout").hidden = true; $("lock").hidden = false; setTimeout(() => $("pin").focus(), 50); }
function showApp(){ $("lock").hidden = true; $("app").hidden = false; $("signout").hidden = false; }
$("lock-form").addEventListener("submit", async e => {
  e.preventDefault();
  const s = $("pin-status"); s.className = "status"; s.textContent = "Checking…"; $("pin-go").disabled = true;
  try { await api("login", {method:"POST", body:{pin:$("pin").value}}); $("pin").value = ""; s.textContent = ""; showApp(); await loadDay(true); startSync(); }
  catch(err){ s.className = "status err"; s.textContent = err.message === "Wrong PIN" ? "That PIN didn't work. Try again." : err.message; }
  finally { $("pin-go").disabled = false; }
});
$("signout").addEventListener("click", async () => { try { await api("logout", {method:"POST"}); } catch(e){} stopSync(); showLock(); });

/* ============ address boxes ============ */
// Each box remembers the place picked for it in its dataset (lat, lon, street, label).
function setPlace(inp, p){
  if (p){ Object.assign(inp.dataset, {lat:p.lat, lon:p.lon, street:p.street || "", label:p.label}); }
  else { delete inp.dataset.lat; delete inp.dataset.lon; delete inp.dataset.street; delete inp.dataset.label; }
}
const placeOf = inp => inp.dataset.lat ? {lat:+inp.dataset.lat, lon:+inp.dataset.lon, street:inp.dataset.street, label:inp.dataset.label} : null;
const noteFor = inp => inp.id === "start" ? $("start-note") : inp.closest("li").querySelector(".note");
function showNote(inp, state){
  const el = noteFor(inp);
  el.className = "note" + (state === "bad" ? " warn" : "");
  el.textContent = {bad:"⚠ Not found", busy:"Checking address…", error:"Couldn't check yet"}[state] || "";
}

// suggestions dropdown, shared by every box
let suggFor = null, suggItems = [], suggPick = -1, suggTimer = 0, suggSeq = 0;
const suggEl = document.createElement("ul"); suggEl.className = "sugg"; suggEl.id = "sugg"; suggEl.setAttribute("role", "listbox"); suggEl.hidden = true;
function closeSugg(){ suggEl.hidden = true; if (suggFor) suggFor.setAttribute("aria-expanded", "false"); suggFor = null; suggItems = []; suggPick = -1; }
function drawSugg(){
  suggEl.innerHTML = suggItems.map((p, i) => `<li role="option" id="sg-${i}" aria-selected="${i === suggPick}" data-i="${i}"><b>${esc(p.line1 || p.label)}</b><span>${esc(p.line2 || "")}</span></li>`).join("");
  suggEl.hidden = !suggItems.length;
  if (suggFor){ suggFor.setAttribute("aria-expanded", String(!!suggItems.length)); suggFor.setAttribute("aria-controls", "sugg"); }
}
function choose(i){
  const inp = suggFor, p = suggItems[i]; if (!inp || !p) return;
  inp.value = p.label; setPlace(inp, p); showNote(inp, ""); closeSugg();
  inp.closest("li")?.classList.add("filled");
  saveDraft(); markStale(); refreshPlanButton();
  const list = [$("start"), ...boxes()], next = list[list.indexOf(inp)+1]; if (next && !next.value) next.focus();
}
suggEl.addEventListener("pointerdown", e => { const li = e.target.closest("li[data-i]"); if (li){ e.preventDefault(); choose(+li.dataset.i); } });

function wireBox(inp){
  inp.setAttribute("role", "combobox"); inp.setAttribute("aria-autocomplete", "list"); inp.setAttribute("aria-expanded", "false");
  inp.addEventListener("input", () => {
    setPlace(inp, null); showNote(inp, "");
    inp.closest("li")?.classList.toggle("filled", !!inp.value.trim());
    refreshPlanButton(); markStale(); saveDraft();
    clearTimeout(suggTimer);
    const text = inp.value.trim();
    if (text.length < 3){ closeSugg(); return; }
    suggTimer = setTimeout(async () => {
      const seq = ++suggSeq;
      try {
        const {results} = await api("suggest?text=" + encodeURIComponent(text));
        if (seq !== suggSeq || document.activeElement !== inp) return;
        suggFor = inp; suggItems = results || []; suggPick = -1;
        inp.parentElement.appendChild(suggEl); drawSugg();
      } catch(e){ if (!(e instanceof NeedPin)) closeSugg(); }
    }, 250);
  });
  inp.addEventListener("keydown", e => {
    if (!suggEl.hidden && suggFor === inp){
      if (e.key === "ArrowDown"){ e.preventDefault(); suggPick = Math.min(suggItems.length-1, suggPick+1); drawSugg(); return; }
      if (e.key === "ArrowUp"){ e.preventDefault(); suggPick = Math.max(0, suggPick-1); drawSugg(); return; }
      if (e.key === "Enter" && suggPick >= 0){ e.preventDefault(); choose(suggPick); return; }
      if (e.key === "Escape"){ closeSugg(); return; }
    }
    if (e.key === "Enter" && inp.id !== "start"){
      e.preventDefault();
      const list = boxes(), next = list[list.indexOf(inp)+1] || (addRow(), syncRows(), boxes().at(-1));
      next.focus();
    }
  });
  inp.addEventListener("blur", () => { setTimeout(() => { if (suggFor === inp) closeSugg(); }, 120); if (inp.value.trim() && !placeOf(inp)) checkBox(inp); });
}

// typed but not picked: look it up once the person moves on
async function checkBox(inp){
  const v = inp.value.trim(); if (!v || placeOf(inp)) return placeOf(inp);
  showNote(inp, "busy");
  try {
    const {result} = await api("geocode?text=" + encodeURIComponent(v));
    if (inp.value.trim() !== v) return null;
    setPlace(inp, result); showNote(inp, result ? "" : "bad"); saveDraft();
    return result;
  } catch(e){ if (inp.value.trim() === v && !(e instanceof NeedPin)) showNote(inp, "error"); return null; }
}

const boxes = () => [...$("jobs").querySelectorAll("input")];
function refreshPlanButton(){
  const n = boxes().filter(b => b.value.trim()).length, go = $("go");
  if (!go.disabled) go.textContent = n ? `Plan route · ${n} stop${n > 1 ? "s" : ""}` : "Plan route";
}
function syncRows(){
  const rows = [...$("jobs").children], extra = rows.length > BASE_BOXES;
  rows.forEach((li, i) => {
    const n = i+1, inp = li.querySelector("input"), btn = li.querySelector(".clr");
    li.querySelector(".jn").textContent = n;
    inp.id = "job-" + n; inp.setAttribute("aria-label", "Job " + n);
    li.classList.toggle("filled", !!inp.value.trim()); li.classList.toggle("extra", extra);
    btn.textContent = extra ? "Remove" : "Clear"; btn.setAttribute("aria-label", btn.textContent + " job " + n);
  });
  refreshPlanButton();
}
function addRow(val = "", p = null){
  const li = document.createElement("li");
  li.innerHTML = '<span class="jn"></span><div class="addr-box"><input type="text" autocomplete="off" enterkeyhint="next" placeholder="Address, city"></div>' +
                 '<button class="clr" type="button">Clear</button><div class="note" aria-live="polite"></div>';
  const inp = li.querySelector("input"); inp.value = val; setPlace(inp, p); wireBox(inp);
  li.querySelector(".clr").addEventListener("click", () => {
    if ($("jobs").children.length > BASE_BOXES) li.remove(); else { inp.value = ""; setPlace(inp, null); showNote(inp, ""); inp.focus(); }
    syncRows(); saveDraft(); markStale();
  });
  $("jobs").appendChild(li);
  return inp;
}
function setJobs(list){        // list of {label, lat?, lon?, street?} or strings
  $("jobs").innerHTML = "";
  for (let i = 0; i < Math.max(BASE_BOXES, list.length); i++){
    const j = list[i]; if (!j){ addRow(); continue; }
    if (typeof j === "string") addRow(j); else addRow(j.label, j.lat != null ? j : null);
  }
  syncRows();
}

// unsent edits stay on this device if the page is closed before planning
function saveDraft(){
  try { localStorage.setItem("cbs-draft", JSON.stringify({day:today(), start:{value:$("start").value, p:placeOf($("start"))},
    jobs:boxes().map(b => ({value:b.value, p:placeOf(b)})), home:$("home").checked, tolls:$("tolls").checked})); } catch(e){}
}
function loadDraft(){
  try { const d = JSON.parse(localStorage.getItem("cbs-draft") || "null"); return d && d.day === today() ? d : null; } catch(e){ return null; }
}

/* ============ planning ============ */
let route = null, updated = 0, done = new Set();

const formSnapshot = () => JSON.stringify([$("start").value.trim(), boxes().map(b => b.value.trim()).filter(Boolean), $("home").checked, $("tolls").checked]);
const routeSnapshot = r => r ? JSON.stringify([r.start.label, r.jobs.map(j => j.label), r.home, r.tolls !== false]) : "";
function markStale(){ const s = $("stale"); if (s) s.hidden = !route || formSnapshot() === routeSnapshot(route); }

const status = (text, err) => { const s = $("status"); s.textContent = text; s.className = "status" + (err ? " err" : ""); };

async function plan(){
  closeSugg();
  const startInp = $("start"), filled = boxes().filter(b => b.value.trim());
  if (!startInp.value.trim()){ status("Add where you start the day.", true); startInp.focus(); return; }
  if (!filled.length){ status("Add at least one job address.", true); boxes()[0].focus(); return; }
  const go = $("go"); go.disabled = true; go.textContent = "Planning…"; status("");
  try {
    const all = [startInp, ...filled];
    const places = await Promise.all(all.map(checkBox));
    const bad = all.filter((b, i) => !places[i]);
    if (bad.length){ bad.forEach(b => showNote(b, "bad")); status(`Fix the address${bad.length > 1 ? "es" : ""} marked ⚠ Not found, then try again.`, true); return; }

    const start = {...places[0], label:startInp.value.trim()};
    const seen = {};
    const jobs = filled.map((b, i) => {
      const p = places[i+1], base = key(b.value) || "job"; seen[base] = (seen[base] || 0) + 1;
      return {id: seen[base] > 1 ? base + "-" + seen[base] : base, label:b.value.trim(), lat:p.lat, lon:p.lon, street:p.street || ""};
    });
    const res = await api("plan", {method:"POST", body:{start, jobs, home:$("home").checked, tolls:$("tolls").checked}});
    const next = {start, jobs, home:$("home").checked, tolls:$("tolls").checked, order:res.order.map(i => jobs[i].id), missed:(res.missed || []).map(i => jobs[i].id), line:res.line || []};
    const saved = await api("day?d=" + today(), {method:"PUT", body:next});
    route = next; updated = saved.updated;
    done = new Set([...done].filter(id => jobs.some(j => j.id === id)));
    showRoute();
    if (matchMedia("(max-width:820px)").matches) $("out-h").scrollIntoView({behavior:"smooth", block:"start"});
  } catch(e){
    if (!(e instanceof NeedPin)) status(e.message, true);
  } finally { go.disabled = false; refreshPlanButton(); }
}

/* ============ the route on screen ============ */
function emptyState(){
  $("progress").textContent = "";
  destroyMap();
  $("out").innerHTML = `<div class="empty"><svg viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="36" fill="var(--soft)"/><path d="M18 50c8-14 14 2 22-10s10-14 14-18" fill="none" stroke="var(--muted)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 7"/><rect x="12" y="44" width="12" height="12" rx="4" fill="var(--deep)"/><circle cx="54" cy="22" r="6" fill="var(--accent)"/></svg>Add today's jobs and tap <b>Plan route</b>.<br>Your stops will show up here in the best order.</div>`;
}
const streetOf = j => j.street || (String(j.label).split(",").map(x => x.trim()).find(x => /^\d+\s/.test(x)) || j.label).replace(/^\d+[a-z]?\s+/i, "");

function showRoute(){
  if (!route){ emptyState(); return; }
  const byId = Object.fromEntries(route.jobs.map(j => [j.id, j]));
  const stops = route.order.map(id => byId[id]).filter(Boolean);
  const endsHome = !!route.home;

  // whole route in Google Maps (Google takes up to 10 places per link)
  const places = [route.start, ...stops, ...(endsHome ? [route.start] : [])].map(p => p.label);
  let links = "";
  for (let a = 0, part = 1; a < places.length-1; a += 9, part++){
    const chunk = places.slice(a, a+10), last = a + chunk.length - 1;
    const label = places.length <= 10 ? "Open route in Google Maps"
      : `Open part ${part} in Google Maps · ${a === 0 ? "start" : "stop " + a} to ${last >= places.length-1 && endsHome ? "HQ" : "stop " + last}`;
    links += `<a class="btn btn-main" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/${chunk.map(encodeURIComponent).join("/")}">${label}${OUT}</a>`;
  }
  const waze = (p, name) => `<div class="navs"><a class="btn nav" target="_blank" rel="noopener" aria-label="Drive to ${esc(name)} with Waze" href="https://waze.com/ul?ll=${p.lat},${p.lon}&navigate=yes">Waze</a></div>`;
  const row = (cls, attrs, name, note) => `<li class="${cls}"${attrs}><span class="rail"><i></i></span><b>${name}</b><small>${note}</small></li>`;

  $("out").innerHTML =
    `<div class="stale" id="stale" hidden>Your jobs changed. Tap Plan route to update the order.</div>
     <div class="actions">${links}</div>
     <div class="map" id="map" role="img" aria-label="Map of today's route"></div>
     <p class="credit">Addresses and routes by <a href="https://www.geoapify.com/" target="_blank" rel="noopener">Geoapify</a></p>
     <ol class="glance" aria-label="Route by street">${row("g-home","","HQ","Start")}${stops.map((j, i) => row("", ` data-id="${esc(j.id)}"`, esc(streetOf(j)), "Stop " + (i+1))).join("")}${endsHome ? row("g-home","","HQ","End") : ""}</ol>
     <p class="from">${HOUSE}<span>Leaving from <b>${esc(route.start.label)}</b></span></p>
     <ol class="stops">${stops.map((j, i) =>
        `<li data-id="${esc(j.id)}"><div class="num">${i+1}</div><div><div class="addr">${esc(j.label)}</div>` +
        `<label class="done-box"><input type="checkbox" id="done-${i+1}" data-id="${esc(j.id)}"> Job done</label></div>${waze(j, "stop " + (i+1))}</li>`).join("")}
       ${endsHome ? `<li><div class="home-ic">${HOUSE}</div><div><div class="addr">Head back to HQ</div><div class="sub">${esc(route.start.label)}</div></div>${waze(route.start, "HQ")}</li>` : ""}
     </ol>
     ${route.missed && route.missed.length ? `<p class="missed">⚠ ${route.missed.length} stop${route.missed.length > 1 ? "s" : ""} couldn't be reached by road and ${route.missed.length > 1 ? "were" : "was"} left off. Check ${route.missed.length > 1 ? "those addresses" : "that address"}.</p>` : ""}`;

  $("out").querySelectorAll(".done-box input").forEach(c => c.addEventListener("change", () => toggleDone(c.dataset.id, c.checked)));
  applyDone(); markStale();
  drawMap(stops, endsHome);
}

// check marks: shown on the list, the overview, and the map; Waze locks on finished stops
function applyDone(){
  if (!route) return;
  const ids = route.order.filter(id => route.jobs.some(j => j.id === id));
  $("progress").textContent = `${ids.filter(id => done.has(id)).length} of ${ids.length} done`;
  $("out").querySelectorAll(".stops > li[data-id]").forEach(li => {
    const on = done.has(li.dataset.id); li.classList.toggle("isdone", on);
    const c = li.querySelector(".done-box input"); if (c) c.checked = on;
    li.querySelectorAll(".nav").forEach(a => { if (on){ a.setAttribute("aria-disabled","true"); a.tabIndex = -1; } else { a.removeAttribute("aria-disabled"); a.removeAttribute("tabindex"); } });
  });
  $("out").querySelectorAll(".glance li[data-id]").forEach(li => li.classList.toggle("done", done.has(li.dataset.id)));
  markers.forEach(m => m.el.classList.toggle("done", done.has(m.id)));
}
async function toggleDone(id, on){
  on ? done.add(id) : done.delete(id); applyDone();
  try { await api("mark?d=" + today(), {method:"POST", body:{job:id, done:on}}); }
  catch(e){ if (!(e instanceof NeedPin)){ on ? done.delete(id) : done.add(id); applyDone(); status("Couldn't save that check mark. Check your signal and try again.", true); } }
}

/* ============ real map ============ */
let map = null, markers = [];
function destroyMap(){ markers.forEach(m => m.marker.remove()); markers = []; if (map){ map.remove(); map = null; } }
function drawMap(stops, endsHome){
  destroyMap();
  const box = $("map");
  if (!window.maplibregl){
    if (document.readyState !== "complete"){ window.addEventListener("load", () => { if (route && $("map")) drawMap(stops, endsHome); }, {once:true}); return; }
    box.innerHTML = '<p class="empty" style="padding:24px">The map couldn\'t load. The stop list below still works.</p>'; return;
  }
  map = new maplibregl.Map({container:box, style:MAP_STYLE, attributionControl:{compact:true}, cooperativeGestures:true});
  map.addControl(new maplibregl.NavigationControl({showCompass:false}), "top-right");
  const pts = [route.start, ...stops].map(p => [p.lon, p.lat]);
  const bounds = pts.reduce((b, p) => b.extend(p), new maplibregl.LngLatBounds(pts[0], pts[0]));
  (route.line || []).forEach(p => bounds.extend(p));
  map.fitBounds(bounds, {padding:36, duration:0, maxZoom:14});
  map.on("load", () => {
    const coords = route.line && route.line.length ? route.line : [...pts, ...(endsHome ? [pts[0]] : [])];
    map.addSource("route", {type:"geojson", data:{type:"Feature", geometry:{type:"LineString", coordinates:coords}}});
    map.addLayer({id:"route-casing", type:"line", source:"route", paint:{"line-color":"#ffffff", "line-width":7}, layout:{"line-join":"round","line-cap":"round"}});
    map.addLayer({id:"route", type:"line", source:"route", paint:{"line-color":getComputedStyle(document.documentElement).getPropertyValue("--route").trim() || "#7e8653", "line-width":4}, layout:{"line-join":"round","line-cap":"round"}});
  });
  const hq = document.createElement("div"); hq.className = "m-hq"; hq.innerHTML = HOUSE; hq.title = "HQ";
  markers.push({id:"hq", el:hq, marker:new maplibregl.Marker({element:hq}).setLngLat(pts[0]).addTo(map)});
  stops.forEach((j, i) => {
    const el = document.createElement("div"); el.className = "m-pin"; el.textContent = i+1; el.title = j.label;
    markers.push({id:j.id, el, marker:new maplibregl.Marker({element:el}).setLngLat([j.lon, j.lat]).addTo(map)});
  });
  applyDone();
}

/* ============ sharing with the crew ============ */
async function loadDay(fillForm){
  const d = await api("day?d=" + today());
  done = new Set(d.done || []);
  const changed = d.updated !== updated;
  route = d.route; updated = d.updated;
  const editing = document.activeElement && document.activeElement.matches("#app input[type=text]");
  if (fillForm || (changed && !editing)){
    const draft = fillForm ? loadDraft() : null;
    if (route && (!draft || formSnapshot() === routeSnapshot(route) || !draft.jobs.some(j => j.value))){
      $("start").value = route.start.label; setPlace($("start"), route.start); $("home").checked = !!route.home; $("tolls").checked = route.tolls !== false; setJobs(route.jobs);
    } else if (draft){
      $("start").value = draft.start.value || DEFAULT_START; setPlace($("start"), draft.start.p); $("home").checked = draft.home !== false; $("tolls").checked = draft.tolls !== false;
      setJobs(draft.jobs.map(j => j.p ? {...j.p, label:j.value} : j.value).filter(Boolean));
    }
  }
  if (changed || fillForm) showRoute(); else applyDone();
}
let syncTimer = 0;
function startSync(){
  stopSync();
  syncTimer = setInterval(() => { if (document.visibilityState === "visible" && !$("app").hidden) loadDay(false).catch(() => {}); }, SYNC_EVERY);
}
function stopSync(){ clearInterval(syncTimer); }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !$("app").hidden) loadDay(false).catch(() => {}); });

/* ============ wiring ============ */
wireBox($("start"));
$("out").addEventListener("click", e => { if (e.target.closest('.nav[aria-disabled="true"]')) e.preventDefault(); });
["home","tolls"].forEach(id => $(id).addEventListener("change", () => { saveDraft(); markStale(); }));
$("go").addEventListener("click", plan);
$("add").addEventListener("click", () => { const inp = addRow(); syncRows(); saveDraft(); inp.focus(); });
let clearArmed = 0;
$("clear").addEventListener("click", async () => {
  const btn = $("clear");
  if (route && !clearArmed){            // the route is shared with the crew, so ask for a second tap
    btn.textContent = "Tap again to clear the route";
    clearArmed = setTimeout(() => { clearArmed = 0; btn.textContent = "Clear all jobs"; }, 3000);
    return;
  }
  clearTimeout(clearArmed); clearArmed = 0; btn.textContent = "Clear all jobs";
  setJobs([]); saveDraft(); status("");
  if (route){
    try { await api("day?d=" + today(), {method:"DELETE"}); }
    catch(e){ if (!(e instanceof NeedPin)) status("Couldn't clear the route. Check your signal and try again.", true); return; }
  }
  route = null; updated = 0; done = new Set(); emptyState();
});
document.addEventListener("pointerdown", e => { if (suggFor && !e.target.closest(".addr-box")) closeSugg(); });

/* ============ start up ============ */
$("start").value = DEFAULT_START;
setJobs([]);
emptyState();
(async () => {
  try { await api("session"); showApp(); await loadDay(true); startSync(); }
  catch(e){ if (!(e instanceof NeedPin)){ showApp(); status(e.message, true); } }
})();
})();
</script>
</body>
